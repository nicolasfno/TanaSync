{% load static %}
<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar-logo">
    <img src="{% static 'employees/logo.svg' %}" alt="Logo TanaSync" width="32" height="32">
    <span class="sidebar-logo-text">TanaSync</span>
  </div>

  <hr class="sidebar-divider">

  <!-- Navigation principale -->
  <nav class="sidebar-nav">
    <a href="{% url 'home_employee' %}" class="nav-item {% if request.resolver_match.url_name == 'home_employee' %}active{% endif %}">
      <img src="{% static 'employees/home.svg' %}" alt="" width="24" height="24">
      <span>Accueil</span>
    </a>
    <a href="{% url 'absence' %}" class="nav-item {% if request.resolver_match.url_name == 'absence' %}active{% endif %}">
      <img src="{% static 'employees/abscences.svg' %}" alt="" width="24" height="24">
      <span>Mes absences</span>
    </a>
    <a href="{% url 'fdp' %}" class="nav-item {% if request.resolver_match.url_name == 'fdp' %}active{% endif %}">
      <img src="{% static 'employees/liste.svg' %}" alt="" width="24" height="24">
      <span>Ma fiche de paie</span>
    </a>
    <a href="{% url 'planning' %}" class="nav-item {% if request.resolver_match.url_name == 'planning' %}active{% endif %}">
      <img src="{% static 'employees/calendrier.svg' %}" alt="" width="24" height="24">
      <span>Mon planning</span>
    </a>
    <a href="#" class="nav-item">
      <img src="{% static 'employees/messagerie.svg' %}" alt="" width="24" height="24">
      <span>Messagerie</span>
      <span class="nav-badge">3</span>
    </a>
    <a href="#" class="nav-item">
      <img src="{% static 'employees/parametres.svg' %}" alt="" width="24" height="24">
      <span>Paramètres</span>
    </a>
  </nav>

  <!-- Footer sidebar -->
  <div class="sidebar-footer">
    <button class="sidebar-footer-btn">
      <img src="{% static 'employees/lune.svg' %}" alt="" width="20" height="20">
      <span>Mode sombre</span>
    </button>
    <button class="sidebar-collapse-btn" aria-label="Réduire la sidebar">‹</button>
  </div>
</aside>
