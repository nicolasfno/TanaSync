{% load static %}


<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar-logo">

    <span class="sidebar-logo-text"></span>
  </div>

  <hr class="sidebar-divider">

  <!-- Navigation principale -->
  <nav class="sidebar-nav">
    <a href="{% url 'home_employee' %}" class="nav-item {% if request.resolver_match.url_name == 'home_employee' %}active{% endif %}">

      <span>Accueil</span>
    </a>
    <a href="{% url 'mes_absences' %}" class="nav-item {% if request.resolver_match.url_name == 'mes_absences' %}active{% endif %}">

    <a href="{% url 'my_pay_slips' %}" class="nav-item {% if request.resolver_match.url_name == 'my_pay_slips' %}active{% endif %}">

      <span>Mes fiches de paie</span>
    </a>
    <a href="{% url 'planning' %}" class="nav-item {% if request.resolver_match.url_name == 'planning' %}active{% endif %}">
